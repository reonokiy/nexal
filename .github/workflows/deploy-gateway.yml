name: Deploy Gateway

on:
  workflow_dispatch:

concurrency:
  group: deploy-gateway
  cancel-in-progress: true

env:
  # Fly token GitHub secret (used for flyctl + set as a runtime secret).
  FLY_API_TOKEN: ${{ secrets.FLY_API_KEY }}
  APP: ${{ vars.FLY_APP || 'nexal' }}
  REGION: ${{ vars.FLY_REGION || 'ams' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Ensure app exists
        run: |
          if ! flyctl apps list | awk '{print $1}' | grep -qx "$APP"; then
            flyctl apps create "$APP" --org "${{ vars.FLY_ORG || 'personal' }}"
          fi

      - name: Ensure runtime secrets
        run: |
          set -euo pipefail
          # The running gateway needs the Fly token to call the Machines API.
          ARGS=("FLY_API_TOKEN=${FLY_API_TOKEN}")

          # Frontend HMAC credential. Prefer repo secrets; otherwise
          # generate a stable random pair once (kept across deploys).
          have=$(flyctl secrets list -a "$APP" 2>/dev/null | awk '{print $1}')
          AK="${{ secrets.NEXAL_GATEWAY_ACCESS_KEY }}"
          SK="${{ secrets.NEXAL_GATEWAY_SECRET_KEY }}"
          if [ -n "$AK" ] && [ -n "$SK" ]; then
            ARGS+=("NEXAL_GATEWAY_ACCESS_KEY=$AK" "NEXAL_GATEWAY_SECRET_KEY=$SK")
          elif ! echo "$have" | grep -qx NEXAL_GATEWAY_ACCESS_KEY; then
            ARGS+=("NEXAL_GATEWAY_ACCESS_KEY=$(openssl rand -hex 8)" "NEXAL_GATEWAY_SECRET_KEY=$(openssl rand -hex 32)")
          fi

          # --stage: apply together with the deploy below (no extra restart).
          flyctl secrets set -a "$APP" --stage "${ARGS[@]}"

      - name: Deploy
        run: flyctl deploy -c deploy/gateway/fly.toml --remote-only -a "$APP" --regions "$REGION" --ha=false

      - name: Dump gateway logs
        run: flyctl logs -a "$APP" -n | tail -30
