name: Build Web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - packages/transport/**
      - package.json
      - bun.lock
      - .github/workflows/web-build.yml
  pull_request:
    paths:
      - web/**
      - packages/transport/**
      - package.json
      - bun.lock
      - .github/workflows/web-build.yml
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check web
        working-directory: web
        run: bun run check

      - name: Build web
        working-directory: web
        run: bun run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexal-web-dist
          path: web/dist
