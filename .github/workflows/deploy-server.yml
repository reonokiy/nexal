name: Deploy Server (LLM)

on:
  push:
    branches: [main]
    paths:
      - src/**
      - packages/**
      - drizzle/**
      - package.json
      - tsconfig.json
      - drizzle.config.ts
      - server.Dockerfile
      - deploy/server/fly.toml
      - .github/workflows/deploy-server.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy to Fly (creates app on first run)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_KEY }}
        run: flyctl deploy -c deploy/server/fly.toml --ha=false

      - name: Sync secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_KEY }}
        run: |
          flyctl secrets set -a nexal-server \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            STORAGE_PROVIDER="${{ secrets.STORAGE_PROVIDER }}" \
            STORAGE_S3_ENDPOINT="${{ secrets.STORAGE_S3_ENDPOINT }}" \
            STORAGE_S3_BUCKET="${{ secrets.STORAGE_S3_BUCKET }}" \
            STORAGE_S3_ACCESS_KEY="${{ secrets.STORAGE_S3_ACCESS_KEY }}" \
            STORAGE_S3_SECRET_KEY="${{ secrets.STORAGE_S3_SECRET_KEY }}" \
            STORAGE_S3_REGION="${{ secrets.STORAGE_S3_REGION }}" \
            NEXAL_GATEWAY_URL="${{ secrets.NEXAL_GATEWAY_URL }}" \
            NEXAL_GATEWAY_ACCESS_KEY="${{ secrets.NEXAL_GATEWAY_ACCESS_KEY }}" \
            NEXAL_GATEWAY_SECRET_KEY="${{ secrets.NEXAL_GATEWAY_SECRET_KEY }}" \
            NEXAL_SUPABASE_URL="${{ secrets.NEXAL_SUPABASE_URL }}" \
            NEXAL_AUTH_ENABLED="${{ secrets.NEXAL_AUTH_ENABLED }}" \
            NEXAL_ADMINS="${{ secrets.NEXAL_ADMINS }}" \
            NEXAL_HTTP_PORT=3000 \
            --stage

      - name: Re-deploy (picks up secrets)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_KEY }}
        run: flyctl deploy -c deploy/server/fly.toml --ha=false
