# Fly app for nexal llm server (Bun daemon)
app = "nexal-server"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

[http_service]
  internal_port = 3000
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"
