# Fly app for nexal-gateway. Agent sandbox machines are NOT declared
# here — the gateway creates them at runtime via the Machines API into
# THIS app, so they share 6PN with the gateway.
app            = "nexal"
primary_region = "ams"

[build]
  dockerfile = "gateway.Dockerfile"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

# HTTP-service layer enables TLS termination + Host routing for shared
# anycast IPs. The gateway responds 200 OK to plain HTTP (Fly probes) and
# upgrades WebSocket for real traffic on the same port.
[http_service]
  internal_port = 5500
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
