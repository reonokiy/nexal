# Fly app for nexal-gateway. Agent sandbox machines are NOT declared
# here — the gateway creates them at runtime via the Machines API into
# THIS app, so they share 6PN with the gateway.
#
# `app`/`primary_region` can be overridden per-deploy via the workflow
# (repo variables FLY_APP / FLY_REGION → flyctl deploy --app/--region).
app            = "nexal"
# EU. Fly compute is flat-priced across standard regions (ams/fra/cdg/
# lhr/arn/mad all base rate) — ams is a well-provisioned primary region.
primary_region = "ams"

[build]
  dockerfile = "gateway.Dockerfile"

# Minimal shared-CPU instance (smallest available).
[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

# Public WebSocket endpoint — raw TCP forwarding on port 80 so Fly proxy
# does not inspect/modify HTTP headers (WebSocket upgrade passes through).
# Port 443 with TLS termination for wss:// clients.
[[services]]
  internal_port = 5500
  protocol      = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Raw TCP on 80 — no handlers so Fly does byte-for-byte forwarding.
  [[services.ports]]
    port = 80

  # TLS-terminated WebSocket on 443.
  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]
